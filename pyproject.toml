[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipd"
version = "0.6.6"
description = "macOS clipboard history manager with OCR and CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "rich>=13.0",
    "textual>=0.80.0",
]

[project.scripts]
clipd = "clipd.cli:cli"
clipd-daemon = "clipd.daemon_entry:main"
clipd-menubar = "clipd.menubar_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["clipd"]
